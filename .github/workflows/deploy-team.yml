# Publishes the team version (docs/ + server/) to Cloudflare Workers on every push to main.
# Needs repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, ADMIN_EMAIL (see server/README.md).
# Without the Cloudflare secrets the job only prints a notice and succeeds.
name: Deploy team server

on:
  push:
    branches: [main]
    paths: ['docs/**', 'server/**', '.github/workflows/deploy-team.yml']
  workflow_dispatch:

concurrency:
  group: deploy-team
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      WRANGLER_SEND_METRICS: 'false'
      CI: 'true'
    steps:
      - name: Check Cloudflare secrets
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set — the team server is not deployed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
        working-directory: .
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install
        if: steps.check.outputs.ready == 'true'
        run: npm ci
      - name: Create or find the database and file storage
        if: steps.check.outputs.ready == 'true'
        run: npm run provision
      - name: Update the database schema
        if: steps.check.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply living-project-hq --remote
      - name: Deploy
        if: steps.check.outputs.ready == 'true'
        run: npx wrangler deploy
      - name: Administrator email
        if: steps.check.outputs.ready == 'true' && env.ADMIN_EMAIL != ''
        run: printf '%s' "$ADMIN_EMAIL" | npx wrangler secret put ADMIN_EMAIL
