name: Diploma checks
on:
  pull_request:
    paths: ['server/public/api/festival-diploma.php', 'server/public/api/diploma-assets/**', 'server/test/festival-diploma.php', '.github/workflows/diploma-checks.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: php -l server/public/api/festival-diploma.php
      - run: php server/test/festival-diploma.php
