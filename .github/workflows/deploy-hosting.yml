# Publishes the team version (docs/ + server/public/) to ordinary PHP hosting (reg.ru) over FTP.
# Repository secrets (see server/README.md): FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, FTP_DIR, ADMIN_EMAIL.
# Without FTP secrets it only builds the site folder and attaches it as a downloadable artifact.
name: Deploy to hosting

on:
  push:
    branches: [main]
    paths: ['docs/**', 'server/**', '.github/workflows/deploy-hosting.yml']
  workflow_dispatch:

concurrency:
  group: deploy-hosting
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check PHP syntax
        run: for f in server/public/api/*.php; do php -l "$f"; done
      - name: Build the site folder
        run: node server/build.mjs
      - name: Attach the site folder for manual upload
        uses: actions/upload-artifact@v4
        with:
          name: site-for-hosting
          path: server/dist/site/
          include-hidden-files: true
          retention-days: 30
      - name: Check the FTP address
        id: ftp
        if: env.FTP_SERVER != ''
        env:
          RAW_SERVER: ${{ secrets.FTP_SERVER }}
          RAW_DIR: ${{ secrets.FTP_DIR }}
        run: |
          # Forgive common copy-paste extras: ftp://, spaces, a path or a :port after the host.
          host="$(printf '%s' "$RAW_SERVER" | tr -d '[:space:]')"
          host="${host#*://}"; host="${host%%/*}"; host="${host%%:*}"
          dir="$(printf '%s' "$RAW_DIR" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          [ -n "$dir" ] && [ "${dir%/}" = "$dir" ] && dir="$dir/"
          echo "::add-mask::$host"
          is_ip=$(printf '%s' "$host" | grep -Eq '^[0-9]{1,3}(\.[0-9]{1,3}){3}$' && echo yes || true)
          if [ -z "$host" ] || { [ -z "$is_ip" ] && ! getent ahosts "$host" > /dev/null; }; then
            echo "::error title=FTP_SERVER::Адрес из секрета FTP_SERVER не найден в интернете. Впишите его так, как в письме Рег.ру или в панели хостинга (раздел «FTP-пользователи»), например server260.hosting.reg.ru или IP-адрес из блока «Доступ к FTP» — без ftp:// и без пробелов."
            exit 1
          fi
          if [ -z "$dir" ]; then
            echo "::error title=FTP_DIR::Секрет FTP_DIR пустой. Укажите папку сайта, например www/zadachimantckd.ru/"
            exit 1
          fi
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
      - name: Upload to hosting (FTPS)
        id: ftps
        if: env.FTP_SERVER != ''
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftp.outputs.host }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ steps.ftp.outputs.dir }}
          local-dir: server/dist/site/
          protocol: ftps
          security: loose
      - name: Upload to hosting (FTP, if FTPS is not available)
        if: env.FTP_SERVER != '' && steps.ftps.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftp.outputs.host }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ steps.ftp.outputs.dir }}
          local-dir: server/dist/site/
          protocol: ftp
      - name: Notice
        if: env.FTP_SERVER == ''
        run: echo "::notice::FTP secrets are not set — download the 'site-for-hosting' artifact and upload it to the site folder manually."
