name: Import source and deploy

on:
  push:
    branches: [main]
    paths:
      - source-parts/READY
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: source-import-and-pages
  cancel-in-progress: true

jobs:
  import-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and extract project
        shell: bash
        run: |
          cat source-parts/part-* | base64 --decode > living-investigation-board.zip
          rm -rf .extract
          mkdir .extract
          unzip -q living-investigation-board.zip -d .extract
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            .extract/living-investigation-board/ ./
          rm -rf .extract living-investigation-board.zip source-parts

      - name: Commit extracted source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "Import Living Investigation Board source"
            git push
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --registry=https://registry.npmjs.org

      - name: Build application
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: import-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
