name: Expand source parts

on:
  push:
    branches: [main]
    paths:
      - source-parts/READY
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and extract project
        shell: bash
        run: |
          cat source-parts/part-* | base64 --decode > living-investigation-board.zip
          rm -rf .extract
          mkdir .extract
          unzip -q living-investigation-board.zip -d .extract
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            .extract/living-investigation-board/ ./
          rm -rf .extract living-investigation-board.zip source-parts

      - name: Commit extracted source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "Import Living Investigation Board source"
            git push
          fi
