# Living Project HQ — team server on Cloudflare Workers.
# The same static app from ../docs is served here; /api/* is handled by src/worker.js.
name = "living-project-hq"
main = "src/worker.js"
compatibility_date = "2026-09-01"

[assets]
directory = "../docs"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Secret (not stored in the repo): ADMIN_EMAIL — the only address allowed to create the first account.
#   npx wrangler secret put ADMIN_EMAIL
# For local development put it into server/.dev.vars as ADMIN_EMAIL=...

[[d1_databases]]
binding = "DB"
database_name = "living-project-hq"
# Replace with the id printed by `npx wrangler d1 create living-project-hq`.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Files attached to task results (up to 10 MB each).
[[kv_namespaces]]
binding = "FILES"
# Replace with the id printed by `npx wrangler kv namespace create living-project-hq-files` (or run `npm run provision`).
id = "00000000000000000000000000000000"
